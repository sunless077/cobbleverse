<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23111' stroke-width='8'/%3E%3Cpath d='M4 50a46 46 0 0 1 92 0z' fill='%23ee1515' stroke='%23111' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='13' fill='%23fff' stroke='%23111' stroke-width='8'/%3E%3C/svg%3E"><title>Cobbleverse Mystery Auction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e6e9f4;--bg2:#fff;--card:#fff;--ink:#1a1c2c;--mut:#59607c;--line:#c5cae0;--edge:#1a1c2c;--st:#ee1515;--red:#ee1515;--yel:#ffcb05;--blue:#3b4cca;--gold:#b87d00;--ok:#14a85c;--bad:#e0334f;--px:"Press Start 2P",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d1f;--bg2:#171a36;--card:#1a1e3e;--ink:#f4f5ff;--mut:#a3a8d1;--line:#363c78;--edge:#000;--gold:#ffcb05;--ok:#3ddc97;--bad:#ff5d7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d1f;--bg2:#171a36;--card:#1a1e3e;--ink:#f4f5ff;--mut:#a3a8d1;--line:#363c78;--edge:#000;--gold:#ffcb05;--ok:#3ddc97;--bad:#ff5d7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;background:radial-gradient(800px 420px at 10% -8%,color-mix(in srgb,var(--st) 28%,transparent),transparent),radial-gradient(600px 400px at 100% 0,color-mix(in srgb,var(--blue) 22%,transparent),transparent),var(--bg);transition:background .6s}
body::before{content:"";position:fixed;right:-170px;bottom:-170px;width:540px;height:540px;border-radius:50%;border:34px solid var(--ink);background:linear-gradient(var(--red) 0 44%,transparent 44% 56%,var(--bg2) 56%);opacity:.055;pointer-events:none}
body.s1{--st:#ffcb05}body.s2{--st:#ff4fa3}body.s3{--st:#ee1515}body.lobby{--st:#ee1515}
.hd{font-family:var(--px)}
main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:14px 14px 70px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:1.6fr 1fr}.wide{grid-column:1/-1}}
.card{background:var(--card);border:3px solid var(--edge);border-radius:18px;padding:16px;box-shadow:0 5px 0 rgba(0,0,0,.22)}
h1{margin:0;font:400 .85rem/1.5 var(--px);letter-spacing:.03em;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);flex:1}
h2{font:400 .62rem/1.4 var(--px);margin:0 0 12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(#f43a3a,#c80f0f 70%);border:3px solid #111;border-radius:18px;padding:10px 16px;box-shadow:0 5px 0 #7a0a0a}
.lens{width:40px;height:40px;border-radius:50%;flex:none;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#d8f6ff,#35b6ff 45%,#1262c9);box-shadow:0 0 0 3px #111,0 0 18px #5ccbff;animation:blink 2.6s infinite}
@keyframes blink{0%,86%,100%{filter:none}92%{filter:brightness(1.6)}}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{padding:6px 12px;border-radius:999px;border:3px solid #111;background:rgba(255,255,255,.88);font:400 .55rem var(--px);color:#444}
.pip.on{background:var(--yel);color:#111;box-shadow:0 0 14px rgba(255,203,5,.8)}
.pip.done{background:#b8f5cf;color:#0a5c2c}
.arena{position:relative;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:hidden;background:linear-gradient(var(--card),var(--card));border-color:var(--edge);box-shadow:0 5px 0 rgba(0,0,0,.22),inset 0 0 70px color-mix(in srgb,var(--st) 24%,transparent)}
.arena::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px)}
.arena>*{position:relative;z-index:1}
.ball{width:150px;height:150px;border-radius:50%;position:relative;border:6px solid #111;background:linear-gradient(#ee1515 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 8px 0 rgba(0,0,0,.25);animation:wig 2.6s infinite}
.ball i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;border:6px solid #111;animation:glow 1.6s infinite}
@keyframes wig{0%,55%,100%{transform:rotate(0)}62%{transform:rotate(-16deg)}72%{transform:rotate(13deg)}82%{transform:rotate(-8deg)}90%{transform:rotate(4deg)}}
@keyframes glow{50%{box-shadow:0 0 24px 8px rgba(255,203,5,.75);background:#fffbe0}}
@keyframes pop{0%{transform:scale(.2) rotate(-14deg);opacity:0;filter:brightness(4)}55%{transform:scale(1.12) rotate(2deg);opacity:1;filter:brightness(1.6)}100%{transform:none;filter:none}}
.mon{width:210px;height:210px;border-radius:24px;object-fit:contain;background:radial-gradient(circle,color-mix(in srgb,var(--st) 38%,transparent),transparent 68%);animation:pop .8s cubic-bezier(.2,.9,.3,1.2)}
.mon{filter:drop-shadow(0 8px 0 rgba(0,0,0,.18))}
.ph{display:grid;place-items:center;font:400 3rem var(--px);color:var(--st);border:3px dashed var(--st)}
.name{font:400 1.15rem/1.5 var(--px);text-transform:uppercase;letter-spacing:.03em}
.bid{font:400 2.3rem/1.2 var(--px);color:var(--gold);text-shadow:3px 3px 0 rgba(0,0,0,.25)}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 1.2rem var(--px)}
.ring.low b{color:var(--bad)}
.bb{display:inline-block;padding:3px 9px;border-radius:8px;border:2px solid #111;background:var(--yel);color:#111;font:400 .55rem var(--px)}
button{font:inherit;font-weight:700;border:3px solid var(--edge);border-bottom-width:5px;background:var(--bg2);color:var(--ink);padding:8px 15px;border-radius:12px;cursor:pointer;transition:transform .08s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(2px);border-bottom-width:3px}
button.p{background:var(--st);color:#111}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;padding:9px 11px;border-radius:10px;border:3px solid var(--line);background:var(--bg2);color:var(--ink);min-width:0}
input:focus,select:focus{outline:0;border-color:var(--st)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:8px}
.tr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px;padding:10px 0;border-top:2px dashed var(--line)}
.tr:first-of-type{border-top:0}
.tr .hd{font-size:.95rem!important}
.me{color:var(--st);font-weight:700;text-shadow:0 0 1px #000}
.sl{display:flex;gap:5px;margin-top:4px}
.sl i{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:400 .55rem var(--px);color:var(--mut);font-style:normal;overflow:hidden;background:var(--bg2)}
.sl i.on{border-color:var(--st);box-shadow:0 0 8px color-mix(in srgb,var(--st) 60%,transparent)}
.sl img{width:100%;height:100%;object-fit:contain}
.hp{height:10px;border-radius:6px;background:#222;border:2px solid #111;overflow:hidden;margin-top:6px}
.hp b{display:block;height:100%;background:var(--ok);transition:width .6s}
.hp b.m{background:#ffcb05}.hp b.l{background:var(--bad)}
.log{max-height:260px;overflow:auto}
.lr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:2px dashed var(--line)}
.lr img,.lr .th{width:38px;height:38px;object-fit:contain;border-radius:10px;flex:none}
.f{display:flex;flex-direction:column;gap:3px;text-align:left}.f label{font-size:.78rem;color:var(--mut)}
.chk{text-align:left;font-size:.92rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;border:3px solid var(--yel);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#mus{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;background:var(--card);border:3px solid var(--edge);border-radius:999px;padding:4px 12px 4px 4px;z-index:8;box-shadow:0 4px 0 rgba(0,0,0,.22)}
#mus button{border-radius:50%;width:36px;height:36px;padding:0;font-size:1.05rem}
#mus input{width:84px;padding:0;border:0;background:none;accent-color:var(--st)}
.cg{display:grid;gap:8px}
.cs{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center}
.cs img,.cs .th{width:46px;height:46px;object-fit:contain;border-radius:10px;border:2px solid var(--line)}
.cand{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 8px 32px}
.cd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:12px;width:84px;font-size:.62rem;color:var(--mut);border-bottom-width:3px}
.cd img{width:72px;height:72px;object-fit:contain}
.cd.sel{background:color-mix(in srgb,var(--st) 25%,var(--bg2));color:var(--ink);border-color:var(--st)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.av{width:56px;height:56px;border-radius:14px;border:3px solid var(--line);background:var(--bg2);display:inline-grid;place-items:center;overflow:hidden;flex:none;padding:0;vertical-align:middle;font:400 .8rem var(--px);color:var(--st)}
.av img{max-width:100%;max-height:100%;image-rendering:pixelated;object-fit:contain}
.av.me{border-color:var(--st)}
.av.s{width:26px;height:26px;border-radius:8px;border-width:2px;font-size:.5rem}
button.av{border-bottom-width:5px;cursor:pointer}
.pkw{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:20;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 12px;overflow:auto}
.pkw.on{display:block}.pkc{max-width:900px;margin:0 auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;max-height:58vh;overflow:auto;margin-top:12px;padding:2px}
.pt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 3px;font-size:.62rem;font-weight:600;border-bottom-width:3px;line-height:1.2}
.pt img{width:60px;height:64px;object-fit:contain;image-rendering:pixelated}
.pt.sel{background:color-mix(in srgb,var(--st) 28%,var(--bg2));border-color:var(--st)}
</style></head>
<body class="lobby"><main id="app"><div class="card wide">Connecting…</div></main><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STG=['','Legendary','Mega','Uber'],ST3=['','L','M','U'];
const view=location.hash==='#creator'?'creator':'main';
let S=null,ws,off=0,resetArmed=false,wipeArmed=false,botAs=null;
let token=localStorage.getItem('tk');if(!token){token=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('tk',token)}
const now=()=>Date.now()+off;
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)};
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const H=(act,x)=>send({t:'host',act,...x});
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{send({t:'hello',token});const k=localStorage.getItem('hostKey');if(k)send({t:'auth',key:k})};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='state'){S=m.s;off=S.now-Date.now();render()}
    else if(m.t==='err')toast(m.m);
    else if(m.t==='authfail'){localStorage.removeItem('hostKey');toast('Wrong host key.')}};
  ws.onclose=()=>setTimeout(connect,1500);
}
const TRB='https://cdn.jsdelivr.net/gh/smogon/sprites@230bd7a051f167166065c91f8ec09ed36102eccf/src/_uncategorized/canonical/trainers/';
const TRR='https://raw.githubusercontent.com/smogon/sprites/230bd7a051f167166065c91f8ec09ed36102eccf/src/_uncategorized/canonical/trainers/';
const avPath=id=>id.split('/').map(encodeURIComponent).join('/');
function avFb(e){if(e.dataset.f)return;e.dataset.f=1;e.src=TRR+avPath(e.dataset.p)}
const avTag=(id,cls,extra)=>'<span class="av '+(cls||'')+'"'+(extra||'')+'>'+(id?'<img src="'+TRB+avPath(id)+'" data-p="'+esc(id)+'" onerror="avFb(this)" loading="lazy" alt="">':'?')+'</span>';
const avOf=pid=>{const p=S&&S.players.find(p=>p.id===pid);return p&&p.av};
const nmv=pid=>avTag(avOf(pid),'s')+' '+nm(pid);
let myAv=localStorage.getItem('av')||'';
const nm=id=>{const p=S.players.find(p=>p.id===id);return p?esc(p.name):'—'};
function pic(id,name,cls){return id?'<img class="'+cls+'" src="/img/'+id+'" alt="">':'<div class="'+cls+' ph">'+esc((name||'?')[0])+'</div>'}
const won=(id,st)=>S.results.find(r=>r.stage===st&&r.winner===id);

function render(){if(view==='creator')return creatorStatus();renderMain()}
function renderMain(){
  const r=S.room,a=S.auction,y=S.you,live=r.status==='live',done=r.status==='done';
  document.body.className=r.status==='lobby'?'lobby':'s'+r.stage;
  const pips=[1,2,3].map(s=>{const d=done||(live&&r.stage>s);return'<span class="pip '+(live&&r.stage===s?'on':'')+(d?' done':'')+'">'+(d?'✓ ':'')+STG[s]+'</span>'}).join('');
  const bbTxt=r.bb?'<div class="mut">Big Blind: <span class="bb">BB</span> <b>'+nmv(r.bb)+'</b></div>':'';
  let arena='';
  if(r.status==='lobby'){
    const n=S.players.length;
    arena='<div class="ball"><i></i></div><div class="name">Mystery Auction</div><div class="mut">3 stages · 1,000 coins · one Pokémon per stage</div>'+
     '<div class="chk"><div>'+(n===10?'✅':'⬜')+' Trainers joined: <b>'+n+'/10</b></div><div>'+(r.test?'🧪 Test run: dummy Pokémon will be used':(S.locked?'✅':'⬜')+' Pokémon list locked in')+'</div></div>'+
     (y.joined?'<div class="mut">You’re in as <b>'+nm(y.id)+'</b>.</div>':n>=10?'<div class="bad">Room is full.</div>':'<div class="row"><button class="av" id="jav" title="Choose your trainer" data-pick="1" style="width:64px;height:64px">'+(myAv?'<img src="'+TRB+avPath(myAv)+'" data-p="'+esc(myAv)+'" onerror="avFb(this)" alt="">':'?')+'</button><input id="jn" maxlength="20" placeholder="Trainer name"><button class="p" id="jb">Join</button></div><div class="mut">Tap the box to pick your trainer sprite.</div>');
  }else if(done){
    arena='<div class="name">Draft complete 🏆</div><div class="mut">Check every trainer’s team on the right.</div>';
  }else if(!a||(a.state==='sold'&&a.stage!==r.stage)){
    arena='<div class="mut">STAGE '+r.stage+' · '+STG[r.stage].toUpperCase()+'</div><div class="ball"><i></i></div><div class="name">Next reveal…</div><div class="mut">Waiting for the host.</div>'+bbTxt;
  }else if(a.state==='live'){
    const h=S.high,me=y.joined,w=won(y.id,a.stage),min=h?h.amount+1:1,mx=me?S.bal[y.id]-(3-r.stage):0;
    arena='<div class="mut">'+STG[a.stage].toUpperCase()+' · LIVE</div>'+pic(a.img,a.name,'mon')+'<div class="name">'+esc(a.name)+'</div>'+
      '<div class="row" style="gap:24px"><div><div class="mut">'+(h?(h.blind?'Big Blind opening':'Highest bid'):'No bids yet')+'</div><div class="bid">'+(h?h.amount:0)+'</div><div class="mut">'+(h?'<b>'+nmv(h.bidder)+'</b>':'&nbsp;')+'</div></div>'+
      '<div class="ring" id="rg"><svg width="96" height="96"><circle cx="48" cy="48" r="42" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="rc" cx="48" cy="48" r="42" fill="none" stroke="var(--st)" stroke-width="7" stroke-linecap="round" stroke-dasharray="264"/></svg><b id="tm"></b></div></div>'+bbTxt+
      (me&&!w?'<div class="mut">Your coins: <b>'+S.bal[y.id]+'</b> · max bid <b>'+mx+'</b></div><div class="row"><button class="p" data-b="'+min+'">Bid '+min+'</button><button data-b="'+(h?h.amount+50:50)+'">'+(h?'+50 → '+(h.amount+50):'Bid 50')+'</button><input id="cb" type="number" inputmode="numeric" placeholder="Custom" style="width:110px"><button id="cbb">Bid</button></div>':
       me?'<div class="ok">You already own your '+STG[a.stage]+'.</div>':'<div class="mut">You’re spectating.</div>');
  }else{
    arena='<div class="mut">SOLD</div>'+pic(a.img,a.name,'mon')+'<div class="name">'+esc(a.name)+'</div><div class="bid">'+a.price+'</div><div>to <b>'+nmv(a.winner)+'</b>'+(a.byBlind?' <span class="bb">BIG BLIND</span>':'')+'</div>'+bbTxt;
  }
  const keep=document.activeElement&&document.activeElement.id==='cb'?document.activeElement.value:null;
  const trainers=S.players.map(p=>{
    const slots=[1,2,3].map(s=>{const x=won(p.id,s);return'<i class="'+(x?'on':'')+'" title="'+(x?esc(x.name)+' · '+x.price:STG[s])+'">'+(x&&x.img?'<img src="/img/'+x.img+'" alt="">':x?esc(x.name[0]):ST3[s])+'</i>'}).join('');
    return'<div class="tr">'+(p.id===y.id?avTag(p.av,'me',' role="button" data-pick="1" title="Change avatar" style="cursor:pointer"'):avTag(p.av,''))+'<div><span class="'+(p.id===y.id?'me':'')+'">'+esc(p.name)+(p.bot?' 🤖':'')+(p.id===y.id?' (you)':'')+'</span> '+(r.bb===p.id&&live?'<span class="bb">BB</span>':'')+
     (y.isHost&&r.status==='lobby'?' <a href="#" data-k="'+p.id+'" class="mut">remove</a>':'')+'<div class="sl">'+slots+'</div><div class="hp"><b class="'+(S.bal[p.id]<200?'l':S.bal[p.id]<500?'m':'')+'" style="width:'+Math.max(0,S.bal[p.id]/10)+'%"></b></div></div><div style="text-align:right"><b class="hd" style="font-size:1.3rem">'+S.bal[p.id]+'</b><div class="mut">coins</div></div></div>'}).join('')||'<span class="mut">Nobody yet.</span>';
  const hist=S.results.slice().sort((x,y)=>y.seq-x.seq).slice(0,25).map(x=>'<div class="lr">'+pic(x.img,x.name,'th')+'<div style="flex:1"><b>'+esc(x.name)+'</b> <span class="mut">'+STG[x.stage]+'</span><br><span class="mut">'+nmv(x.winner)+(x.byBlind?' · Big Blind':'')+'</span></div><b class="hd">'+x.price+'</b></div>').join('')||'<span class="mut">No sales yet.</span>';
  const open=document.querySelector('details#hl')&&document.querySelector('details#hl').open;
  const focusHost=$('hostp')&&$('hostp').contains(document.activeElement)&&/INPUT|SELECT/.test(document.activeElement.tagName);
  const hostHtml=focusHost?$('hostp').innerHTML:hostPanel();
  $('app').innerHTML='<div class="wide top"><span class="lens"></span><h1>COBBLEVERSE MYSTERY AUCTION</h1><div class="pips">'+(r.test?'<span class="pip" style="color:var(--gold);border-color:var(--gold)">🧪 TEST RUN</span>':'')+pips+'</div></div>'+
    '<section class="card arena">'+arena+'</section><section class="card"><h2>Trainers</h2>'+trainers+'</section>'+
    '<section class="card"><h2>Auction history</h2><div class="log">'+hist+'</div></section><section class="card" id="hostp">'+hostHtml+'</section>';
  if(open)document.querySelector('details#hl').open=true;
  const jb=$('jb');if(jb)jb.onclick=()=>send({t:'join',name:$('jn').value,av:myAv});
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=openPicker);
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>send({t:'bid',amount:+b.dataset.b}));
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=e=>{e.preventDefault();H('kick',{id:b.dataset.k})});
  const cb=$('cb');if(cb){if(keep!==null){cb.value=keep;cb.focus()}const go=()=>send({t:'bid',amount:parseInt(cb.value,10)});$('cbb').onclick=go;cb.onkeydown=e=>{if(e.key==='Enter')go()}}
  wireHost();tick();audioSync();
}
function hostPanel(){
  const y=S.you,r=S.room,a=S.auction;
  if(!y.isHost)return'<h2>Host</h2><details id="hl"><summary class="mut">Host login</summary><div class="row" style="justify-content:flex-start"><input id="hk" type="password" placeholder="Host key"><button id="hkb">Log in</button></div></details>';
  const sold=!a||a.state==='sold',ex=S.eligible.length;
  let h='<h2>Host console</h2><div class="cg">';
  if(r.status==='lobby'){
    h+='<div class="f"><label>Auction timer (seconds)</label><select id="ht">'+[20,30,45,60].map(t=>'<option'+(r.timer===t?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'+
      '<div class="f"><label>Big Blind rule</label><select id="hm"><option value="A"'+(r.mode==='A'?' selected':'')+'>A · buys for 1 only if nobody bids</option><option value="B"'+(r.mode==='B'?' selected':'')+'>B · poker-style, opens at 1</option></select></div>'+
      '<button class="p" id="hgo"'+(S.players.length===10&&(S.locked||r.test)?'':' disabled')+'>Start Stage 1</button>'+
      (r.test?'<div class="mut">🧪 Test run: dummy Pokémon, nothing counts and the real pool stays untouched.</div><div class="row" style="justify-content:flex-start"><button id="hbots">Fill with dummy trainers</button><button id="hrm">Remove dummies</button><button id="hend">Exit test run</button></div>':'<button id="htest">🧪 Start a test run</button>');
  }else if(r.status==='live'){
    if(sold&&ex>0)h+='<button class="p" id="hr">Reveal next Pokémon</button>';
    if(sold&&ex===0&&r.stage<3)h+='<button class="p" id="hadv">Advance to '+STG[r.stage+1]+' stage</button>';
    if(sold&&ex===0&&r.stage===3)h+='<button class="p" id="hfin">Finish draft</button>';
    if(r.test){const bots=S.players.filter(p=>p.bot&&!won(p.id,r.stage));if(!bots.some(b=>b.id===botAs))botAs=bots[0]&&bots[0].id;
      h+='<div class="mut">🧪 Test run</div>';
      if(a&&a.state==='live'&&bots.length){const mn=S.high?S.high.amount+1:1;
        h+='<div class="row" style="justify-content:flex-start"><div class="f"><label>Bid for a dummy</label><select id="bas">'+bots.map(b=>'<option value="'+b.id+'"'+(b.id===botAs?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select></div><button id="hbb">Bid '+mn+'</button><button id="hb5">+50</button></div>'}
      h+='<label class="mut"><input type="checkbox" id="hbp"'+(r.botplay?' checked':'')+'> Dummies bid on their own</label><button id="hend">Exit test run</button>'}
    if(a&&a.state==='live')h+='<button class="p" id="hs"'+(now()>=a.endsAt?'':' disabled')+'>Settle auction</button><div class="mut">Enabled when the timer reaches zero.</div>';
  }
  h+='<label class="mut"><input type="checkbox" id="ha"'+(r.auto?' checked':'')+'> Auto-settle when the timer ends</label>';
  h+='<div class="row" style="justify-content:flex-start"><button id="hrs">'+(resetArmed?'Click again to wipe the draft':'Reset draft')+'</button>'+
     (r.status==='lobby'&&S.locked?'<button id="hwp">'+(wipeArmed?'Click again to delete the pool':'Delete pool list')+'</button>':'')+'</div></div>';
  return h;
}
function wireHost(){
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on('hkb',()=>{localStorage.setItem('hostKey',$('hk').value.trim());send({t:'auth',key:$('hk').value.trim()})});
  if($('ht')){$('ht').onchange=e=>H('config',{timer:+e.target.value});$('hm').onchange=e=>H('config',{mode:e.target.value})}
  if($('ha'))$('ha').onchange=e=>H('config',{auto:e.target.checked});
  on('hgo',()=>H('start'));on('htest',()=>H('test',{on:true}));on('hbots',()=>H('addbots'));on('hrm',()=>H('rmbots'));on('hend',()=>H('endtest'));
  if($('bas'))$('bas').onchange=e=>{botAs=e.target.value};
  if($('hbp'))$('hbp').onchange=e=>H('config',{botplay:e.target.checked});

  on('hbb',bb(false));on('hb5',bb(true));on('hr',()=>H('reveal'));on('hadv',()=>H('advance'));on('hfin',()=>H('finish'));on('hs',()=>H('settle'));
  on('hrs',()=>{if(!resetArmed){resetArmed=true;render();setTimeout(()=>{resetArmed=false;render()},4000);return}resetArmed=false;H('reset')});
  on('hwp',()=>{if(!wipeArmed){wipeArmed=true;render();setTimeout(()=>{wipeArmed=false;render()},4000);return}wipeArmed=false;H('wipepool')});
}
function tick(){
  if(view!=='main'||!S||!S.auction||S.auction.state!=='live')return;
  const ms=S.auction.endsAt-now(),s=Math.max(0,Math.ceil(ms/1000)),t=$('tm'),c=$('rc');
  if(t){t.textContent=s;$('rg').classList.toggle('low',s<=10)}
  if(s>0&&s<=5&&AU.lt!==s){AU.lt=s;sfx('tick')}
  if(c)c.style.strokeDashoffset=264*(1-Math.min(1,Math.max(0,ms/1000/Math.max(S.room.timer,10))));
  const b=$('hs');if(b)b.disabled=ms>0;
}
setInterval(tick,300);

/* ---------- creator ---------- */
const C={slots:JSON.parse(localStorage.getItem('draft')||'{}'),built:false,timers:{},cands:{}};
const pick=s=>s&&(s.image||s.imageUrl)||'';
const cnt=()=>Object.values(C.slots).filter(s=>s&&s.name&&s.name.trim()).length;
async function shrink(f){const bm=await createImageBitmap(f),k=Math.min(1,300/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/webp',.82)}
const draft=()=>{try{localStorage.setItem('draft',JSON.stringify(C.slots))}catch(e){toast('Draft too large to keep locally.')}};
function thumb(k){const el=$('p'+k),u=pick(C.slots[k]);if(!el)return;el.innerHTML=u?'<img src="'+esc(u)+'" alt="" style="width:46px;height:46px;object-fit:contain;border-radius:10px;border:1px solid var(--line)">':'<span style="display:inline-block;width:46px;height:46px;border:1px dashed var(--line);border-radius:10px"></span>'}
function mark(k){const u=pick(C.slots[k]);document.querySelectorAll('[data-c="'+k+'"]').forEach(b=>b.classList.toggle('sel',b.dataset.u===u))}
function setSlot(k,p){C.slots[k]=Object.assign({stage:+k[1],name:'',image:'',imageUrl:''},C.slots[k],p);draft();thumb(k);mark(k);creatorStatus()}
async function find(k){
  const s=C.slots[k];if(!s||!s.name||s.name.length<2)return;
  const key=$('ck').value.trim();if(!key)return toast('Enter the creator key first.');
  const box=$('c'+k);box.innerHTML='<span class="mut">Searching…</span>';
  try{
    const r=await fetch('/api/search?q='+encodeURIComponent(s.name),{headers:{'x-creator-key':key}}),j=await r.json();
    if(!r.ok)throw new Error(j.error||'Search failed');
    const res=j.results||[];
    box.innerHTML=res.length?res.map(c=>'<button class="cd" data-c="'+k+'" data-u="'+esc(c.url)+'" title="'+esc(c.label)+'"><img src="'+esc(c.url)+'" loading="lazy" alt=""><span>'+esc(c.label)+'</span></button>').join(''):'<span class="mut">No pictures found. Check the spelling or upload your own.</span>';
    if(res.length&&!pick(C.slots[k]))setSlot(k,{imageUrl:res[0].url});else mark(k);
  }catch(e){box.innerHTML='<span class="bad">'+esc(e.message)+'</span>'}
}
function buildCreator(){
  C.built=true;
  let h='<div class="wide top"><span class="lens"></span><h1>POOL KEEPER</h1><div class="mut" id="cst"></div></div><section class="card wide"><div class="row" style="justify-content:flex-start"><div class="f"><label>Creator key</label><input id="ck" type="password" placeholder="Creator key"></div><button id="fa">Find pictures for all</button></div>'+
   '<p class="mut">Type each Pokémon’s name. Pictures are looked up automatically: click the one you want (the first is pre-selected). You can also upload your own. The server keeps the list secret and only shows a Pokémon when it’s revealed.</p></section>';
  for(let s=1;s<=3;s++){h+='<section class="card"><h2>Stage '+s+' · '+STG[s]+'</h2><div class="cg">';
    for(let i=0;i<10;i++){const k='s'+s+'_'+i;h+='<div class="cs"><span class="mut">'+(i+1)+'</span><input data-n="'+k+'" maxlength="30" placeholder="Pokémon name"><span style="display:flex;gap:6px;align-items:center"><span id="p'+k+'"></span><button data-i="'+k+'">Upload</button><input type="file" accept="image/*" data-f="'+k+'" hidden></span><div class="cand" id="c'+k+'"></div></div>'}
    h+='</div></section>'}
  h+='<section class="card wide"><div class="row"><button class="p" id="lk">Submit &amp; lock list</button></div></section>';
  $('app').innerHTML=h;$('ck').value=localStorage.getItem('creatorKey')||'';
  for(const k in C.slots){const n=document.querySelector('[data-n="'+k+'"]');if(n)n.value=C.slots[k].name||'';thumb(k)}
  document.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{const k=e.dataset.n;
    const changed=(C.slots[k]&&C.slots[k].name)!==e.value.trim();
    setSlot(k,changed?{name:e.value.trim(),imageUrl:'',image:''}:{name:e.value.trim()});
    clearTimeout(C.timers[k]);if(changed)C.timers[k]=setTimeout(()=>find(k),700)});
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>document.querySelector('[data-f="'+b.dataset.i+'"]').click());
  document.querySelectorAll('[data-f]').forEach(f=>f.onchange=async()=>{const file=f.files[0];if(!file)return;try{setSlot(f.dataset.f,{image:await shrink(file),imageUrl:''})}catch(e){toast('Couldn’t read that image.')}});
  $('app').addEventListener('click',e=>{const b=e.target.closest('.cd');if(b&&!S?.locked)setSlot(b.dataset.c,{imageUrl:b.dataset.u,image:''})});
  $('fa').onclick=async()=>{for(const k of Object.keys(C.slots)){if(C.slots[k].name){await find(k);await new Promise(r=>setTimeout(r,150))}}};
  $('lk').onclick=async()=>{
    if(cnt()<30)return toast('Fill in all 30 names first ('+cnt()+'/30).');
    const miss=Object.values(C.slots).filter(s=>!pick(s)).length;
    if(miss&&!$('lk').dataset.ok){$('lk').dataset.ok=1;$('lk').textContent=miss+' have no picture. Click again to lock anyway';return}
    const key=$('ck').value.trim();localStorage.setItem('creatorKey',key);
    const items=Object.values(C.slots).map(s=>({stage:s.stage,name:s.name,image:s.image||'',imageUrl:s.imageUrl||''}));
    $('lk').disabled=true;$('lk').textContent='Uploading…';
    const res=await fetch('/api/pool',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,items})});
    const j=await res.json().catch(()=>({}));
    if(res.ok){localStorage.removeItem('draft');toast('List locked ✓')}else{toast(j.error||'Upload failed.');$('lk').disabled=false;$('lk').textContent='Submit & lock list'}
  };
}
function creatorStatus(){
  if(!C.built)buildCreator();
  const lk=S&&S.locked;$('cst').textContent=lk?'Locked ✓ · you can close this page':cnt()+'/30 Pokémon named';
  document.querySelectorAll('[data-n],[data-i],#lk,#fa,.cd').forEach(x=>x.disabled=!!lk);
}

/* ---------- sound (original chiptune, synthesized in the browser) ---------- */
const AU={ctx:null,on:localStorage.getItem('snd')!=='0',vol:+(localStorage.getItem('vol')||.5),track:null,step:0,next:0,want:['route',''],cur:null,files:[],mons:[],el:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
const bars=(...b)=>b.flat();
const TRACKS={
 route:{bpm:112,
  lead:bars([76,0,79,0,84,0,79,76],[81,0,76,0,72,0,76,81],[77,0,81,0,84,0,81,77],[79,0,83,0,86,0,83,79],[84,0,79,0,76,0,79,84],[81,0,84,0,88,0,84,81],[84,0,81,0,77,0,81,84],[83,0,79,0,74,0,79,83]),
  bass:[48,45,41,43,48,45,41,43].flatMap(r=>[r,0,r+7,0,r+12,0,r+7,0])},
 battle:{bpm:154,hat:1,
  lead:bars([69,72,76,81,79,76,72,76],[65,69,72,77,76,72,69,72],[67,71,74,79,77,74,71,74],[64,68,71,76,74,71,68,71],[81,0,81,76,0,76,72,76],[77,0,77,72,0,72,69,72],[79,0,79,74,0,74,71,74],[76,80,83,88,83,80,76,0]),
  bass:[45,41,43,40,45,41,43,40].flatMap(r=>[r,r,r+12,r,r,r+12,r,r])}};
function ctxInit(){if(AU.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.vol*.5;AU.master.connect(AU.ctx.destination)}
function tone(f,t,d,type,g){const o=AU.ctx.createOscillator(),n=AU.ctx.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(g,t+.01);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n);n.connect(AU.master);o.start(t);o.stop(t+d+.03)}
function hat(t){const b=AU.ctx.createBuffer(1,2000,AU.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AU.ctx.createBufferSource(),g=AU.ctx.createGain();s.buffer=b;g.gain.value=.06;s.connect(g);g.connect(AU.master);s.start(t)}
function sched(){
  if(!AU.ctx||!AU.on||!AU.track)return;const T=AU.track,spb=60/T.bpm/2;
  while(AU.next<AU.ctx.currentTime+.35){const i=AU.step%T.lead.length,l=T.lead[i],b=T.bass[i];
    if(l)tone(mf(l),AU.next,spb*.92,'square',.07);if(b)tone(mf(b),AU.next,spb*.95,'triangle',.18);if(T.hat&&i%2)hat(AU.next);AU.next+=spb;AU.step++}
}
setInterval(sched,100);
const SFX={bid:[[88,.06],[93,.09]],tick:[[84,.05]],reveal:[[72,.07],[76,.07],[79,.07],[84,.07],[88,.07],[91,.18]],
  sold:[[79,.09],[79,.09],[79,.09],[84,.28],[0,.05],[81,.09],[84,.3]],fanfare:[[72,.12],[72,.12],[72,.12],[72,.3],[68,.3],[70,.3],[72,.12],[0,.06],[70,.1],[72,.5]]};
function sfx(n){if(!AU.ctx||!AU.on)return;let t=AU.ctx.currentTime+.02;for(const[m,d]of SFX[n]){if(m){tone(mf(m),t,d*1.1,'square',.09);tone(mf(m-12),t,d*1.1,'triangle',.1)}t+=d}}
const GENW=new Set(['battle','theme','music','legendary','wild']);
const toks=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'.]/g,'').split(/[^a-z0-9]+/).filter(Boolean);
function monMatch(name){   // files in music/pokemon/ named after the Pokémon; "a+b.mp3" matches either a or b
  const mt=new Set(toks(name));let best=[],bs=0;
  for(const f of AU.mons){for(const alt of f.replace(/\.[^.]+$/,'').split('+')){
    const t=toks(alt).filter(x=>!GENW.has(x));
    if(t.length&&t.every(x=>mt.has(x))){const sc=t.length*2+(f.includes('+')?0:1);if(sc>bs){bs=sc;best=[f]}else if(sc===bs&&!best.includes(f))best.push(f)}}}
  return best.length?best[Math.floor(Math.random()*best.length)]:null;
}
function playFile(mode,name){
  let url=null;
  if(mode==='battle'&&name){const m=monMatch(name);if(m)url='/music/pokemon/'+encodeURIComponent(m)}
  if(!url){
    const sp=AU.files.filter(f=>new RegExp(mode==='battle'?'battle':'lobby|route','i').test(f)),gen=AU.files.filter(f=>!/battle|lobby|route/i.test(f));
    const list=sp.length?sp:gen;if(!list.length)return false;
    url='/music/'+encodeURIComponent(list[Math.floor(Math.random()*list.length)]);
  }
  if(!AU.el)AU.el=new Audio();
  AU.el.volume=AU.vol;AU.el.onended=()=>playFile(AU.curMode,AU.curName);AU.el.src=url;AU.el.play().catch(()=>{});return true;
}
function setBg(mode,name){
  AU.want=[mode,name||''];const key=mode+'|'+(mode==='battle'?name||'':'');
  if(!AU.ctx||!AU.on||AU.cur===key)return;AU.cur=key;AU.curMode=mode;AU.curName=name||'';
  if(AU.el)AU.el.pause();AU.track=null;
  if(!playFile(mode,name)){AU.track=TRACKS[mode];AU.step=0;AU.next=AU.ctx.currentTime+.08}
}
function audioSync(){
  if(!S)return;const a=S.auction,r=S.room,key=a?a.seq+':'+a.state:'';
  if(AU.key!==undefined&&key!==AU.key&&a){if(a.state==='live')sfx('reveal');else if(a.state==='sold')sfx('sold')}
  AU.key=key;
  const hv=S.high?S.high.amount:0;if(AU.hv!==undefined&&hv>AU.hv&&a&&a.state==='live')sfx('bid');AU.hv=hv;
  if(r.status==='done'&&!AU.fan){AU.fan=1;sfx('fanfare')}if(r.status!=='done')AU.fan=0;
  const lv=r.status==='live'&&a&&a.state==='live';setBg(lv?'battle':'route',lv?a.name:'');
}
document.body.insertAdjacentHTML('beforeend','<div id="mus"><button id="mb" title="Sound on/off"></button><input id="mv" type="range" min="0" max="1" step="0.05" title="Volume"></div>');
const mbIcon=()=>{$('mb').textContent=AU.on?'🔊':'🔇'};mbIcon();$('mv').value=AU.vol;
$('mb').onclick=()=>{ctxInit();if(AU.ctx&&AU.ctx.resume)AU.ctx.resume();AU.on=!AU.on;localStorage.setItem('snd',AU.on?'1':'0');mbIcon();
  if(!AU.on){AU.track=null;AU.cur=null;if(AU.el)AU.el.pause()}else{AU.cur=null;setBg(...AU.want)}};
$('mv').oninput=e=>{AU.vol=+e.target.value;localStorage.setItem('vol',AU.vol);if(AU.master)AU.master.gain.value=AU.vol*.5;if(AU.el)AU.el.volume=AU.vol};
addEventListener('pointerdown',()=>{if(AU.ctx)return;ctxInit();if(AU.ctx&&AU.ctx.resume)AU.ctx.resume();if(AU.on)setBg(...AU.want)},{once:false});
fetch('/api/music').then(r=>r.json()).then(j=>{AU.files=j.files||[];AU.mons=j.pokemon||[]}).catch(()=>{});

if(view==='creator')buildCreator();
connect();
